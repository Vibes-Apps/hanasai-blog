# Blogu yayınlar: main'e her push'ta (CMS'te "Save" de bir push'tur) test → derleme → yalnızca hanasai-blog Worker'ına deploy.
# Çekirdek Worker (hanasai) bu akışta hiç derlenmez ve deploy edilmez.
#
# Yetki: CLOUDFLARE_API_TOKEN, Cloudflare'de hesaba ait (account-owned) bir token; kapsamı "Specified Workers: hanasai-blog",
# rolü Editor, route izni YOK. Bu yüzden route'lara dokunan `wrangler deploy` yerine `versions upload` + `versions deploy`
# kullanılır (route bir kez elle kuruldu: gethanas.com/blog*). Token sızsa bile yalnızca blog Worker'ı etkilenir.
# Workers Builds kullanılmıyor: derleme token'ı hesap genelinde "Workers Scripts edit" ve tüm zone'larda route yetkili
# (çekirdek repo TECH_PLAN §19).
name: Deploy blog

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "public/**"
      - "src/**"
      - "styles/**"
      - "vendor/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-blog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test (içerik ve derleme kuralları)
        run: npm test
      - name: Build (taslaklar hariç)
        run: npm run build
      - name: Deploy (yalnızca hanasai-blog)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TAG="${GITHUB_SHA::12}"
          npx wrangler versions upload --tag "$TAG" --message "$(git log -1 --format=%s | cut -c1-100)"
          npx wrangler versions deploy --version-tag "$TAG@100%" --message "GitHub Actions $TAG" -y
